document.addEventListener('DOMContentLoaded', async function() {

    var p = document.body || document.documentElement;

    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {

      return;

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {

        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

w(0 6px 10px rgba(0,0,0,.55));\n    color:#ffffff;\n  }\n  .card .chip{\n    position:absolute;left:14px;top:14px;width:10px;height:10px;border-radius:50%;\n    background:radial-gradient(circle at 30% 30%, #fff, #cccccc 55%, #555 100%);\n    box-shadow:0 0 12px rgba(255,255,255,.6);\n  }\n  .card .strip{\n    position:absolute;left:14px;right:14px;bottom:16px;height:6px;border-radius:6px;\n    background:linear-gradient(90deg, rgba(255,255,255,.18), rgba(255,255,255,.04));\n  }\n\n  /* Variation in card sizes */\n  .card.sm{width:96px;height:120px;border-radius:18px}\n  .card.lg{width:140px;height:172px;border-radius:26px}\n\n  /* Position satellites along each ring */\n  .pos{position:absolute;left:50%;top:50%;transform-style:preserve-3d}\n  /* Helper: place a satellite at angle a and radius r along the ring (the ring is in the rotated plane) */\n  .place{\n    --r:270px; --a:0deg; --h:0px;\n    transform:translate(-50%,-50%) rotateZ(var(--a)) translateX(var(--r)) translateZ(var(--h));\n  }\n\n  /* ---------- Particles — monochrome white ---------- */\n  .particles{position:absolute;inset:0;pointer-events:none;z-index:25}\n  .p{\n    position:absolute;bottom:-20px;width:4px;height:4px;border-radius:50%;\n    background:radial-gradient(circle, #ffffff 0%, rgba(255,255,255,.5) 40%, transparent 70%);\n    box-shadow:0 0 8px rgba(255,255,255,.5);\n    animation:rise linear infinite;\n    opacity:0;\n  }\n  .p.warm{background:radial-gradient(circle, #ffffff 0%, rgba(255,255,255,.4) 40%, transparent 70%);box-shadow:0 0 8px rgba(255,255,255,.35)}\n  .p.cool{background:radial-gradient(circle, #ffffff 0%, rgba(255,255,255,.6) 40%, transparent 70%);box-shadow:0 0 8px rgba(255,255,255,.55)}\n  @keyframes rise{\n    0%   {opacity:0; transform:translate(0,0) scale(.6)}\n    10%  {opacity:1}\n    80%  {opacity:.9}\n    100% {opacity:0; transform:translate(var(--dx,20px), -110vh) scale(1)}\n  }\n\n  /* ---------- DOF (poor man's) ---------- */\n  .dof-near{filter:blur(2.5px)}\n * Sections */\n  .section{\n    position:relative;\n    padding:140px 40px;\n    max-width:1240px;margin:0 auto;\n  }\n  .section-eyebrow{\n    display:inline-flex;align-items:center;gap:10px;\n    padding:6px 12px;border-radius:999px;\n    border:1px solid rgba(255,255,255,.10);\n    background:rgba(255,255,255,.03);\n    color:#888888;font-size:12px;letter-spacing:.18em;text-transform:uppercase;\n  }\n  .section-eyebrow::before{\n    content:\"\";width:5px;height:5px;border-radius:50%;\n    background:#ffffff;box-shadow:0 0 8px rgba(255,255,255,.7);\n  }\n  .section-title{\n    margin-top:18px;\n    font-size:clamp(36px,4.6vw,64px);\n    font-weight:600;line-height:1.05;letter-spacing:-.02em;\n    color:#ffffff;max-width:18ch;text-wrap:balance;\n  }\n  .section-title .accent{\n    background:linear-gradient(180deg, #ffffff 0%, #cccccc 60%, #666666 100%);\n    -webkit-background-clip:text;background-clip:text;color:transparent;\n    font-style:italic;font-weight:500;\n  }\n  .section-sub{\n    margin-top:18px;color:#888888;\n    font-size:17px;line-height:1.55;max-width:60ch;\n  }\n  .section-head{margin-bottom:80px;text-align:center;display:flex;flex-direction:column;align-items:center}\n  .section-head .section-title{text-align:center}\n  .section-head .section-sub{text-align:center}\n\n  /* Reusable glass card — monochrome */\n  .glass{\n    position:relative;border-radius:24px;\n    background:\n      linear-gradient(155deg, rgba(255,255,255,.06), rgba(255,255,255,.012) 55%, rgba(0,0,0,.35)),\n      linear-gradient(135deg, #111111, #0a0a0a);\n    border:1px solid rgba(255,255,255,.08);\n    box-shadow:\n      0 30px 60px rgba(0,0,0,.55),\n      0 6px 14px rgba(0,0,0,.45),\n      inset 0 1px 0 rgba(255,255,255,.08),\n      inset 0 -22px 30px rgba(0,0,0,.5);\n    backdrop-filter:blur(6px);\n    overflow:hidden;\n    transition:transform .5s cubic-bezier(.2,.7,.2,1), border-color .3s;\n  }\n  .glass::before{\n    content:\"\";position:absolute;inset:0;border-radius:inherit;pointer-events:none;\n    background:linear-gradient(140deg, rgba(255,255,255,.14), transparent 38%);\n    mix-blend-mode:screen;opacity:.6;\n  }\n  .glass::after{\n    content:\"\";position:absolute;inset:0;border-radius:inherit;pointer-events:none;\n    background:linear-gradient(310deg, rgba(255,255,255,.06), transparent 45%);\n    mix-blend-mode:screen;opacity:.5;\n  }\n  .glass:hover{transform:translateY(-4px);border-color:rgba(255,255,255,.18)}\n\n  /* ============================================================\n     How it works — 3 steps\n     ============================================================ */\n  .how-bg{\n    position:absolute;inset:0;pointer-events:none;overflow:hidden;\n  }\n  .how-bg .blob-warm{\n    position:absolute;left:-10%;top:10%;width:50%;height:50%;\n    background:radial-gradient(closest-side, rgba(255,255,255,.04), transparent 70%);\n    filter:blur(40px);\n  }\n  .how-bg .blob-cool{\n    position:absolute;right:-10%;bottom:0;width:55%;height:55%;\n    background:radial-gradient(closest-side, rgba(255,255,255,.03), transparent 70%);\n    filter:blur(40px);\n  }\n  .steps{\n    display:grid;grid-template-columns:repeat(3,1fr);gap:28px;\n    position:relative;\n  }\n  .steps::before{\n    /* connector line behind the row */\n    content:\"\";position:absolute;left:8%;right:8%;top:108px;height:1px;\n    background:linear-gradient(90deg, transparent, rgba(255,255,255,.14), rgba(255,255,255,.14), transparent);\n    z-index:0;\n  }\n  .step{\n    position:relative;\n    padding:36px 30px 34px;\n    display:flex;flex-direction:column;gap:16px;\n    z-index:1;\n  }\n  .step-num{\n    position:absolute;top:18px;right:20px;font-size:11px;letter-spacing:.22em;\n    color:#666666;font-weight:500;\n  }\n  .step-icon{\n    width:78px;height:78px;border-radius:20px;\n    display:grid;place-items:center;\n    background:\n      radial-gradient(closest-side at 30% 25%, rgba(255,255,255,.10), transparent 70%),\n      linear-gradient(160deg, rgba(255,255,255,.04), rgba(0,0,0,.4));\n    border:1px solid rgba(255,255,255,.10);\n    box-shadow:\n      0 0 24px rgba(255,255,255,.05),\n      inset 0 1px 0 rgba(255,255,255,.14);\n    color:#ffffff;\n  }\n  .step-icon svg{width:36px;height:36px;filter:drop-shadow(0 0 6px rgba(255,255,255,.35))}\n  .step h3{font-size:22px;font-weight:600;letter-spacing:-.01em;color:#ffffff;margin-top:6px}\n  .step p{color:#888888;font-size:15px;line-height:1.6}\n  .step .arrow{\n    position:absolute;right:-20px;top:122px;color:rgba(255,255,255,.22);z-index:2;\n  }\n  .step:last-child .arrow{display:none}\n\n  /* ============================================================\n     What you get — 2x2 grid\n     ============================================================ */\n  .features{\n    display:grid;grid-template-columns:repeat(2,1fr);gap:28px;\n  }\n  .feature{\n    padding:42px 38px;\n    display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:start;\n    min-height:220px;\n  }\n  .feature-icon{\n    width:68px;height:68px;border-radius:18px;\n    display:grid;place-items:center;flex-shrink:0;\n    background:\n      radial-gradient(closest-side at 30% 25%, rgba(255,255,255,.10), transparent 70%),\n      linear-gradient(160deg, rgba(255,255,255,.04), rgba(0,0,0,.4));\n    border:1px solid rgba(255,255,255,.10);\n    box-shadow:0 0 24px rgba(255,255,255,.04), inset 0 1px 0 rgba(255,255,255,.14);\n    color:#ffffff;position:relative;\n  }\n  .feature-icon svg{width:32px;height:32px;filter:drop-shadow(0 0 6px rgba(255,255,255,.30))}\n  .feature h3{font-size:22px;font-weight:600;letter-spacing:-.01em;color:#ffffff;margin-bottom:10px}\n  .feature p{color:#888888;font-size:15px;line-height:1.6}\n  .feature .tag{\n    margin-top:14px;display:inline-flex;gap:8px;flex-wrap:wrap;\n  }\n  .feature .tag span{\n    font-size:11px;letter-spacing:.12em;text-transform:uppercase;\n    padding:5px 10px;border-radius:999px;\n    background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.10);\n    color:#888888;\n  }\n\n  /* ============================================================\n     CTA section\n     ============================================================ */\n  .cta-section{\n    position:relative;\n    padding:160px 40px 180px;\n    overflow:hidden;\n    text-align:center;\n    background:\n      radial-gradient(60% 90% at 50% 100%, rgba(255,255,255,.05), transparent 60%),\n      radial-gradient(80% 50% at 18% 10%, rgba(255,255,255,.025), transparent 60%),\n      radial-gradient(80% 50% at 82% 80%, rgba(255,255,255,.025), transparent 60%);\n    border-top:1px solid rgba(255,255,255,.06);\n    border-bottom:1px solid rgba(255,255,255,.06);\n  }\n  .cta-particles{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:1}\n  .cta-inner{position:relative;z-index:2;max-width:780px;margin:0 auto}\n  .cta-title{\n    font-size:clamp(40px,5.4vw,76px);\n    font-weight:600;line-height:1.04;letter-spacing:-.025em;\n    color:#ffffff;text-wrap:balance;\n  }\n  .cta-title .accent-green{\n    background:linear-gradient(180deg, #e8ffef 0%, #7ef0a8 45%, #1f8a5b 100%);\n    -webkit-background-clip:text;background-clip:text;color:transparent;\n    font-style:italic;font-weight:500;\n    filter:drop-shadow(0 0 18px rgba(126,240,168,.35));\n  }\n  .cta-title .accent{\n    background:linear-gradient(180deg, #ffffff 0%, #cccccc 60%, #666666 100%);\n    -webkit-background-clip:text;background-clip:text;color:transparent;\n    font-style:italic;font-weight:500;\n  }\n  .cta-sub{\n    margin-top:22px;color:#888888;font-size:18px;line-height:1.55;\n    max-width:54ch;margin-left:auto;margin-right:auto;\n  }\n  .cta-btn{\n    margin-top:48px;\n    display:inline-flex;align-items:center;gap:12px;\n    padding:18px 36px;border-radius:999px;\n    font-size:17px;font-weight:600;letter-spacing:.005em;\n    color:#000000;border:1px solid rgba(255,255,255,.5);\n    background:#ffffff;\n    box-shadow:\n      0 0 0 1px rgba(255,255,255,.06),\n      0 0 40px rgba(255,255,255,.18),\n      0 20px 50px rgba(0,0,0,.6),\n      inset 0 1px 0 rgba(255,255,255,.9);\n    cursor:pointer;position:relative;\n    transition:transform .25s cubic-bezier(.2,.7,.2,1), box-shadow .25s;\n  }\n  .cta-btn:hover{\n    transform:translateY(-2px);\n    box-shadow:\n      0 0 0 1px rgba(255,255,255,.10),\n      0 0 60px rgba(255,255,255,.30),\n      0 26px 60px rgba(0,0,0,.65),\n      inset 0 1px 0 rgba(255,255,255,1);\n  }\n  .cta-btn .arrow-r{width:18px;height:18px}\n  .cta-meta{\n    margin-top:22px;color:#666666;font-size:13px;letter-spacing:.04em;\n  }\n\n  /* ============================================================\n     Footer\n     ============================================================ */\n  .footer{\n    padding:50px 40px;border-top:1px solid rgba(255,255,255,.06);\n    display:flex;align-items:center;justify-content:space-between;\n    color:#666666;font-size:13px;letter-spacing:.02em;\n  }\n  .footer .brand{font-size:15px;color:#ffffff}\n  .footer .legal{display:flex;gap:24px}\n  .footer .legal a{color:inherit;text-decoration:none;transition:color .2s}\n  .footer .legal a:hover{color:#ffffff}\n\n  /* Section divider — soft horizon between sections */\n  .divider{\n    height:1px;max-width:1240px;margin:0 auto;\n    background:linear-gradient(90deg, transparent, rgba(255,255,255,.08), transparent);\n  }\n\n  @media (max-width:880px){\n    .nav{padding:18px 22px}\n    .nav-links{display:none}\n    .section{padding:90px 22px}\n    .steps{grid-template-columns:1fr;gap:24px}\n    .steps::before{display:none}\n    .step .arrow{display:none}\n    .features{grid-template-columns:1fr}\n    .feature{grid-template-columns:1fr;padding:32px 26px;min-height:0}\n  }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<!-- ========================= NAV ========================= -->\n<nav class=\"nav\">\n  <div class=\"brand\">\n    <span class=\"brand-mark\"><\u002Fspan>\n    Filiz\n  <\u002Fdiv>\n  <div class=\"nav-links\">\n    <a href=\"#how\">Nasıl Çalışır<\u002Fa>\n    <a href=\"#features\">Özellikler<\u002Fa>\n    <a href=\"#start\">Hakkında<\u002Fa>\n  <\u002Fdiv>\n  <button class=\"nav-cta\">Başla<\u002Fbutton>\n<\u002Fnav>\n\n<div class=\"stage\" id=\"stage\" data-screen-label=\"Hero\">\n  <div class=\"light-warm\"><\u002Fdiv>\n  <div class=\"light-cool\"><\u002Fdiv>\n\n  <div class=\"world\" id=\"world\">\n\n    <!-- Ground/reflection -->\n    <div class=\"ground\"><\u002Fdiv>\n\n    <!-- Orbit 3 (far) -->\n    <div class=\"orbit o3 dof-far\">\n      <div class=\"ring\"><\u002Fdiv>\n      <div class=\"pos place\" style=\"--r:480px;--a:25deg;--h:60px\">\n        <div class=\"sat\"><div class=\"sat-inner bob-c\">\n          <div class=\"card sm\" style=\"--ry:-22deg;--rx:6deg\">\n            <div class=\"chip\"><\u002Fdiv>\n            <div class=\"face\">\n              <!-- store -->\n              <svg class=\"icon\" viewBox=\"0 0 64 64\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n                <path d=\"M10 24l4-10h36l4 10\"><\u002Fpath>\n                <path d=\"M10 24v26h44V24\"><\u002Fpath>\n                <path d=\"M10 24c0 4 3 7 7 7s7-3 7-7c0 4 3 7 7 7s7-3 7-7c0 4 3 7 7 7s7-3 7-7\"><\u002Fpath>\n                <path d=\"M26 50V36h12v14\"><\u002Fpath>\n              <\u002Fsvg>\n            <\u002Fdiv>\n            <div class=\"strip\"><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"pos place\" style=\"--r:480px;--a:155deg;--h:-30px\">\n        <div class=\"sat\"><div class=\"sat-inner\">\n          <div class=\"card sm\" style=\"--ry:18deg;--rx:-4deg\">\n            <div class=\"chip\"><\u002Fdiv>\n            <div class=\"face\">\n              <!-- credit card -->\n              <svg class=\"icon\" viewBox=\"0 0 64 64\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n                <rect x=\"8\" y=\"14\" width=\"48\" height=\"36\" rx=\"5\"><\u002Frect>\n                <path d=\"M8 24h48\"><\u002Fpath>\n                <path d=\"M16 40h10M30 40h6\"><\u002Fpath>\n              <\u002Fsvg>\n            <\u002Fdiv>\n            <div class=\"strip\"><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"pos place\" style=\"--r:480px;--a:265deg;--h:20px\">\n        <div class=\"sat\"><div class=\"sat-inner bob-b\">\n          <div class=\"card sm\" style=\"--ry:-10deg;--rx:10deg\">\n            <div class=\"chip\"><\u002Fdiv>\n            <div class=\"face\">\n              <!-- tag -->\n              <svg class=\"icon\" viewBox=\"0 0 64 64\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n                <path d=\"M30 8H12a4 4 0 0 0-4 4v18l26 26 22-22z\"><\u002Fpath>\n                <circle cx=\"20\" cy=\"20\" r=\"3\"><\u002Fcircle>\n              <\u002Fsvg>\n            <\u002Fdiv>\n            <div class=\"strip\"><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Orbit 2 (mid) -->\n    <div class=\"orbit o2\">\n      <div class=\"ring\"><\u002Fdiv>\n      <div class=\"pos place\" style=\"--r:380px;--a:60deg;--h:90px\">\n        <div class=\"sat\"><div class=\"sat-inner\">\n          <div class=\"card\" style=\"--ry:-18deg;--rx:6deg\">\n            <div class=\"chip\"><\u002Fdiv>\n            <div class=\"face\">\n              <!-- shopping bag -->\n              <svg class=\"icon\" viewBox=\"0 0 64 64\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n                <path d=\"M14 22h36l-3 30a4 4 0 0 1-4 4H21a4 4 0 0 1-4-4z\"><\u002Fpath>\n                <path d=\"M22 22a10 10 0 0 1 20 0\"><\u002Fpath>\n              <\u002Fsvg>\n            <\u002Fdiv>\n            <div class=\"strip\"><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"pos place\" style=\"--r:380px;--a:200deg;--h:-50px\">\n        <div class=\"sat\"><div class=\"sat-inner bob-c\">\n          <div class=\"card\" style=\"--ry:20deg;--rx:-6deg\">\n            <div class=\"chip\"><\u002Fdiv>\n            <div class=\"face\">\n              <!-- package box -->\n              <svg class=\"icon\" viewBox=\"0 0 64 64\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n                <path d=\"M32 8L8 20v24l24 12 24-12V20z\"><\u002Fpath>\n                <path d=\"M8 20l24 12 24-12\"><\u002Fpath>\n                <path d=\"M32 32v24\"><\u002Fpath>\n                <path d=\"M20 14l24 12\"><\u002Fpath>\n              <\u002Fsvg>\n            <\u002Fdiv>\n            <div class=\"strip\"><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"pos place\" style=\"--r:380px;--a:320deg;--h:30px\">\n        <div class=\"sat\"><div class=\"sat-inner bob-b\">\n          <div class=\"card\" style=\"--ry:-6deg;--rx:8deg\">\n            <div class=\"chip\"><\u002Fdiv>\n            <div class=\"face\">\n              <!-- storefront window -->\n              <svg class=\"icon\" viewBox=\"0 0 64 64\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n                <rect x=\"10\" y=\"14\" width=\"44\" height=\"38\" rx=\"3\"><\u002Frect>\n                <path d=\"M10 24h44\"><\u002Fpath>\n                <circle cx=\"18\" cy=\"19\" r=\"1.4\" fill=\"currentColor\"><\u002Fcircle>\n                <circle cx=\"24\" cy=\"19\" r=\"1.4\" fill=\"currentColor\"><\u002Fcircle>\n                <path d=\"M20 34h24M20 40h16\"><\u002Fpath>\n              <\u002Fsvg>\n            <\u002Fdiv>\n            <div class=\"strip\"><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Orbit 1 (near, larger cards) -->\n    <div class=\"orbit o1 dof-near\">\n      <div class=\"ring\"><\u002Fdiv>\n      <div class=\"pos place\" style=\"--r:260px;--a:35deg;--h:140px\">\n        <div class=\"sat\"><div class=\"sat-inner bob-b\">\n          <div class=\"card lg\" style=\"--ry:-22deg;--rx:6deg\">\n            <div class=\"chip\"><\u002Fdiv>\n            <div class=\"face\">\n              <!-- cart -->\n              <svg class=\"icon\" viewBox=\"0 0 64 64\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n                <path d=\"M8 12h6l4 28a4 4 0 0 0 4 3h24a4 4 0 0 0 4-3l3-18H18\"><\u002Fpath>\n                <circle cx=\"24\" cy=\"52\" r=\"3\"><\u002Fcircle>\n                <circle cx=\"44\" cy=\"52\" r=\"3\"><\u002Fcircle>\n              <\u002Fsvg>\n            <\u002Fdiv>\n            <div class=\"strip\"><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"pos place\" style=\"--r:260px;--a:215deg;--h:-100px\">\n        <div class=\"sat\"><div class=\"sat-inner\">\n          <div class=\"card lg\" style=\"--ry:22deg;--rx:-8deg\">\n            <div class=\"chip\"><\u002Fdiv>\n            <div class=\"face\">\n              <!-- bag w handle -->\n              <svg class=\"icon\" viewBox=\"0 0 64 64\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n                <path d=\"M16 24h32l-2 28a4 4 0 0 1-4 4H22a4 4 0 0 1-4-4z\"><\u002Fpath>\n                <path d=\"M24 24v-4a8 8 0 0 1 16 0v4\"><\u002Fpath>\n                <path d=\"M26 36h12\"><\u002Fpath>\n              <\u002Fsvg>\n            <\u002Fdiv>\n            <div class=\"strip\"><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Center sprout -->\n    <div class=\"sprout-wrap\">\n      <div class=\"glow-core\"><\u002Fdiv>\n\n      <div class=\"sprout\">\n        <svg viewBox=\"0 0 160 200\" aria-hidden=\"true\">\n          <defs>\n            <linearGradient id=\"stem\" x1=\"0\" x2=\"1\" y1=\"0\" y2=\"0\">\n              <stop offset=\"0%\" stop-color=\"#0f3a25\"><\u002Fstop>\n              <stop offset=\"55%\" stop-color=\"#5fd594\"><\u002Fstop>\n              <stop offset=\"100%\" stop-color=\"#c9ffe1\"><\u002Fstop>\n            <\u002FlinearGradient>\n            <radialGradient id=\"leafA\" cx=\"30%\" cy=\"30%\" r=\"80%\">\n              <stop offset=\"0%\" stop-color=\"#e8ffef\"><\u002Fstop>\n              <stop offset=\"30%\" stop-color=\"#7ef0a8\"><\u002Fstop>\n              <stop offset=\"70%\" stop-color=\"#1f8a5b\"><\u002Fstop>\n              <stop offset=\"100%\" stop-color=\"#062a17\"><\u002Fstop>\n            <\u002FradialGradient>\n            <radialGradient id=\"leafB\" cx=\"70%\" cy=\"35%\" r=\"85%\">\n              <stop offset=\"0%\" stop-color=\"#f0fff6\"><\u002Fstop>\n              <stop offset=\"25%\" stop-color=\"#9bf6bd\"><\u002Fstop>\n              <stop offset=\"70%\" stop-color=\"#2aa66c\"><\u002Fstop>\n              <stop offset=\"100%\" stop-color=\"#04200f\"><\u002Fstop>\n            <\u002FradialGradient>\n            <radialGradient id=\"warmKick\" cx=\"20%\" cy=\"20%\" r=\"80%\">\n              <stop offset=\"0%\" stop-color=\"rgba(220,255,232,.85)\"><\u002Fstop>\n              <stop offset=\"60%\" stop-color=\"rgba(220,255,232,0)\"><\u002Fstop>\n            <\u002FradialGradient>\n            <filter id=\"soft\" x=\"-50%\" y=\"-50%\" width=\"200%\" height=\"200%\">\n              <feGaussianBlur stdDeviation=\".6\"><\u002FfeGaussianBlur>\n            <\u002Ffilter>\n          <\u002Fdefs>\n\n          <!-- stem -->\n          <path d=\"M80 200 C 80 160, 82 140, 80 110 C 78 90, 82 70, 80 50\" stroke=\"url(#stem)\" stroke-width=\"6\" stroke-linecap=\"round\" fill=\"none\" filter=\"url(#soft)\"><\u002Fpath>\n\n          <!-- left leaf -->\n          <path d=\"M80 95 C 50 90, 28 70, 26 50 C 50 48, 76 65, 80 95 Z\" fill=\"url(#leafA)\"><\u002Fpath>\n          <path d=\"M80 95 C 60 88, 44 76, 36 60\" stroke=\"#03180c\" stroke-width=\"1.2\" fill=\"none\" opacity=\".55\"><\u002Fpath>\n          <!-- warm rim on left leaf -->\n          <path d=\"M80 95 C 50 90, 28 70, 26 50 C 50 48, 76 65, 80 95 Z\" fill=\"url(#warmKick)\" opacity=\".55\"><\u002Fpath>\n\n          <!-- right leaf (larger, higher) -->\n          <path d=\"M80 78 C 110 70, 134 48, 138 24 C 110 26, 86 46, 80 78 Z\" fill=\"url(#leafB)\"><\u002Fpath>\n          <path d=\"M80 78 C 100 70, 118 56, 128 38\" stroke=\"#03180c\" stroke-width=\"1.2\" fill=\"none\" opacity=\".55\"><\u002Fpath>\n          <path d=\"M80 78 C 110 70, 134 48, 138 24 C 110 26, 86 46, 80 78 Z\" fill=\"url(#warmKick)\" opacity=\".35\"><\u002Fpath>\n\n          <!-- tiny bud at top -->\n          <circle cx=\"80\" cy=\"50\" r=\"4\" fill=\"#e8ffef\"><\u002Fcircle>\n          <circle cx=\"80\" cy=\"50\" r=\"9\" fill=\"rgba(126,240,168,.45)\"><\u002Fcircle>\n        <\u002Fsvg>\n      <\u002Fdiv>\n\n      <div class=\"soil-rim\"><\u002Fdiv>\n      <div class=\"soil\"><\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n\n  <!-- Particles layer -->\n  <div class=\"particles\" id=\"particles\"><\u002Fdiv>\n\n  <div class=\"horizon\"><\u002Fdiv>\n  <div class=\"vignette\"><\u002Fdiv>\n  <div class=\"grain\"><\u002Fdiv>\n  <div class=\"cursor-hint\" id=\"hint\"><\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ========================= HOW IT WORKS ========================= -->\n<section class=\"section\" id=\"how\" data-screen-label=\"How It Works\">\n  <div class=\"how-bg\">\n    <div class=\"blob-warm\"><\u002Fdiv>\n    <div class=\"blob-cool\"><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"section-head\">\n    <span class=\"section-eyebrow\">Nasıl Çalışır<\u002Fspan>\n    <h2 class=\"section-title\">Üç adımda <span class=\"accent\">marketplace<\u002Fspan>'ine kavuş<\u002Fh2>\n    <p class=\"section-sub\">Ürün fikrinden satışa hazır pakete üç adım. AI bütün analizi yapar, sen sadece başlat.<\u002Fp>\n  <\u002Fdiv>\n\n  <div class=\"steps\">\n    <!-- Step 1 -->\n    <div class=\"glass step\">\n      <span class=\"step-num\">ADIM 01<\u002Fspan>\n      <div class=\"step-icon\">\n        <svg viewBox=\"0 0 64 64\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\n          <rect x=\"8\" y=\"10\" width=\"48\" height=\"44\" rx=\"6\"><\u002Frect>\n          <path d=\"M16 22h32M16 32h22M16 42h16\"><\u002Fpath>\n          <circle cx=\"48\" cy=\"42\" r=\"6\" fill=\"currentColor\" opacity=\".25\"><\u002Fcircle>\n          <path d=\"M44 42l3 3 5-6\"><\u002Fpath>\n        <\u002Fsvg>\n      <\u002Fdiv>\n      <h3>Bilgilerini Gir<\u002Fh3>\n      <p>Ürün kategorin, hedef pazar ve bütçeni paylaş. Birkaç soruyla başlayalım — beş dakikadan az sürer.<\u002Fp>\n      <svg class=\"arrow\" width=\"40\" height=\"40\" viewBox=\"0 0 40 40\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\">\n        <path d=\"M10 20h22M24 12l8 8-8 8\"><\u002Fpath>\n      <\u002Fsvg>\n    <\u002Fdiv>\n\n    <!-- Step 2 -->\n    <div class=\"glass step\">\n      <span class=\"step-num\">ADIM 02<\u002Fspan>\n      <div class=\"step-icon\">\n        <svg viewBox=\"0 0 64 64\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\n          <circle cx=\"32\" cy=\"32\" r=\"14\"><\u002Fcircle>\n          <path d=\"M32 18v6M32 40v6M18 32h6M40 32h6M22 22l4 4M38 38l4 4M22 42l4-4M38 26l4-4\"><\u002Fpath>\n          <circle cx=\"32\" cy=\"32\" r=\"4\" fill=\"currentColor\"><\u002Fcircle>\n        <\u002Fsvg>\n      <\u002Fdiv>\n      <h3>AI Analiz Eder<\u002Fh3>\n      <p>Yapay zekâ marketplace fırsatlarını, rekabeti ve yasal gereklilikleri saniyeler içinde değerlendirir.<\u002Fp>\n      <svg class=\"arrow\" width=\"40\" height=\"40\" viewBox=\"0 0 40 40\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\">\n        <path d=\"M10 20h22M24 12l8 8-8 8\"><\u002Fpath>\n      <\u002Fsvg>\n    <\u002Fdiv>\n\n    <!-- Step 3 -->\n    <div class=\"glass step\">\n      <span class=\"step-num\">ADIM 03<\u002Fspan>\n      <div class=\"step-icon\">\n        <svg viewBox=\"0 0 64 64\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\n          <path d=\"M32 8L8 20v24l24 12 24-12V20z\"><\u002Fpath>\n          <path d=\"M8 20l24 12 24-12\"><\u002Fpath>\n          <path d=\"M32 32v24\"><\u002Fpath>\n          <path d=\"M20 14l24 12\"><\u002Fpath>\n        <\u002Fsvg>\n      <\u002Fdiv>\n      <h3>Paketini Al<\u002Fh3>\n      <p>Şirket önerileri, marketplace stratejisi, hukuki adımlar ve 30 günlük yol haritan hazır — indir ve başla.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<div class=\"divider\"><\u002Fdiv>\n\n<!-- ========================= WHAT YOU GET ========================= -->\n<section class=\"section\" id=\"features\" data-screen-label=\"Features\">\n  <div class=\"section-head\">\n    <span class=\"section-eyebrow\">Ne Alırsın<\u002Fspan>\n    <h2 class=\"section-title\">Girişimin için <span class=\"accent\">eksiksiz başlangıç<\u002Fspan> paketi<\u002Fh2>\n    <p class=\"section-sub\">Tek bir analizden dört kritik çıktı. İsmin, kanalın, yasal çerçeven ve net bir yol haritası.<\u002Fp>\n  <\u002Fdiv>\n\n  <div class=\"features\">\n    <!-- Feature 1: Şirket İsmi -->\n    <div class=\"glass feature\">\n      <div class=\"feature-icon\">\n        <svg viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\n          <path d=\"M10 12h28M10 22h28M10 32h18\"><\u002Fpath>\n          <circle cx=\"36\" cy=\"34\" r=\"6\"><\u002Fcircle>\n          <path d=\"M40 38l4 4\"><\u002Fpath>\n        <\u002Fsvg>\n      <\u002Fdiv>\n      <div>\n        <h3>Şirket İsmi Önerisi<\u002Fh3>\n        <p>Sektörüne, hedef kitlene ve marka tonuna uygun 12+ özgün isim önerisi. Her isim için domain ve marka tescil durumu kontrol edilir.<\u002Fp>\n        <div class=\"tag\"><span>Domain<\u002Fspan><span>Marka tescili<\u002Fspan><span>Ton analizi<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Feature 2: Marketplace -->\n    <div class=\"glass feature\">\n      <div class=\"feature-icon\">\n        <svg viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\n          <path d=\"M8 18l3-7h26l3 7\"><\u002Fpath>\n          <path d=\"M8 18v22h32V18\"><\u002Fpath>\n          <path d=\"M8 18c0 3 2 5 5 5s5-2 5-5c0 3 2 5 5 5s5-2 5-5c0 3 2 5 5 5s5-2 5-5\"><\u002Fpath>\n          <path d=\"M20 40V30h8v10\"><\u002Fpath>\n        <\u002Fsvg>\n      <\u002Fdiv>\n      <div>\n        <h3>Marketplace Seçimi<\u002Fh3>\n        <p>Trendyol, Hepsiburada, Amazon TR, Etsy ve dahası. Ürününe ve marjına en uygun kanallar veriyle önerilir.<\u002Fp>\n        <div class=\"tag\"><span>Komisyon<\u002Fspan><span>Hedef kitle<\u002Fspan><span>Rekabet<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Feature 3: Yasal -->\n    <div class=\"glass feature\">\n      <div class=\"feature-icon\">\n        <svg viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\n          <path d=\"M24 6l16 6v10c0 11-7 17-16 20-9-3-16-9-16-20V12z\"><\u002Fpath>\n          <path d=\"M16 23l6 6 10-12\"><\u002Fpath>\n        <\u002Fsvg>\n      <\u002Fdiv>\n      <div>\n        <h3>Yasal Gereklilikler<\u002Fh3>\n        <p>Şahıs şirketi mi LTD mi? KDV, e-fatura, mesafeli satış sözleşmesi — tüm yasal kontrol listesi adım adım.<\u002Fp>\n        <div class=\"tag\"><span>Vergi<\u002Fspan><span>KVKK<\u002Fspan><span>Sözleşmeler<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Feature 4: Yol Haritası -->\n    <div class=\"glass feature\">\n      <div class=\"feature-icon\">\n        <svg viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\n          <path d=\"M8 12c4-4 10 4 16 0s8-4 16 0\"><\u002Fpath>\n          <path d=\"M8 24c4-4 10 4 16 0s8-4 16 0\"><\u002Fpath>\n          <path d=\"M8 36c4-4 10 4 16 0s8-4 16 0\"><\u002Fpath>\n          <circle cx=\"8\" cy=\"12\" r=\"2\" fill=\"currentColor\"><\u002Fcircle>\n          <circle cx=\"40\" cy=\"24\" r=\"2\" fill=\"currentColor\"><\u002Fcircle>\n          <circle cx=\"24\" cy=\"36\" r=\"2\" fill=\"currentColor\"><\u002Fcircle>\n        <\u002Fsvg>\n      <\u002Fdiv>\n      <div>\n        <h3>30 Günlük Yol Haritası<\u002Fh3>\n        <p>Birinci günden otuzuncu güne kadar günlük görevler. Lansman, ilk satış ve büyüme — net adımlarla planlı.<\u002Fp>\n        <div class=\"tag\"><span>Günlük plan<\u002Fspan><span>Kilometre taşları<\u002Fspan><span>Takip<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ========================= CTA ========================= -->\n<section class=\"cta-section\" id=\"start\" data-screen-label=\"CTA\">\n  <div class=\"cta-particles\" id=\"ctaParticles\"><\u002Fdiv>\n  <div class=\"cta-inner\">\n    <span class=\"section-eyebrow\">Başlama Zamanı<\u002Fspan>\n    <h2 class=\"cta-title\" style=\"margin-top:20px\">Fikrinin <span class=\"accent-green\">filizlenme<\u002Fspan> zamanı geldi<\u002Fh2>\n    <p class=\"cta-sub\">Birkaç dakika içinde girişiminin haritası elinde olsun.<\u002Fp>\n    <button class=\"cta-btn\">\n      Yolculuğuna Başla\n      <svg class=\"arrow-r\" viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n        <path d=\"M4 10h12M11 5l5 5-5 5\"><\u002Fpath>\n      <\u002Fsvg>\n    <\u002Fbutton>\n\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ========================= FOOTER ========================= -->\n<footer class=\"footer\">\n  <div class=\"brand\">\n    <span class=\"brand-mark\"><\u002Fspan>\n    Filiz\n  <\u002Fdiv>\n  <div>© 2026 Filiz<\u002Fdiv>\n<\u002Ffooter>\n\n<script>\n  // Mouse parallax: tilt the whole world + tilt each card a little extra\n  const stage = document.getElementById('stage');\n  const world = document.getElementById('world');\n  const hint  = document.getElementById('hint');\n  const cards = document.querySelectorAll('#stage .card');\n\n  let tx = 0, ty = 0, cx = 0, cy = 0;\n  stage.addEventListener('pointermove', (e) => {\n    const r = stage.getBoundingClientRect();\n    const nx = (e.clientX - r.left) / r.width  - .5;  // -.5..+.5\n    const ny = (e.clientY - r.top)  / r.height - .5;\n    tx = nx * 10;       // world Y tilt\n    ty = -ny * 6;       // world X tilt\n    cx = nx;\n    cy = ny;\n    hint.style.left = (e.clientX - r.left) + 'px';\n    hint.style.top  = (e.clientY - r.top)  + 'px';\n    hint.style.opacity = .25;\n  });\n  stage.addEventListener('pointerleave', () => { tx=0; ty=0; cx=0; cy=0; hint.style.opacity = 0; });\n\n  function tick(){\n    world.style.setProperty('--mx', tx.toFixed(2) + 'deg');\n    world.style.setProperty('--my', ty.toFixed(2) + 'deg');\n    // Per-card extra tilt\n    cards.forEach((c, i) => {\n      const base = parseFloat(c.style.getPropertyValue('--ry')) || 0;\n      const baseX = parseFloat(c.style.getPropertyValue('--rx')) || 0;\n      const ry = base + cx * 10;\n      const rx = baseX - cy * 8;\n      c.style.transform = `rotateY(${ry.toFixed(2)}deg) rotateX(${rx.toFixed(2)}deg)`;\n    });\n    requestAnimationFrame(tick);\n  }\n  tick();\n\n  // Particles\n  const layer = document.getElementById('particles');\n  const tints = ['', 'warm', 'cool', '', '', 'cool'];\n  for (let i = 0; i < 60; i++){\n    const p = document.createElement('span');\n    const tint = tints[Math.floor(Math.random() * tints.length)];\n    p.className = 'p' + (tint ? ' ' + tint : '');\n    const left = Math.random() * 100;\n    const size = 2 + Math.random() * 4;\n    const dur  = 9 + Math.random() * 14;\n    const delay = -Math.random() * dur;\n    const dx = (Math.random() * 60 - 30) + 'px';\n    p.style.left = left + '%';\n    p.style.width = size + 'px';\n    p.style.height = size + 'px';\n    p.style.setProperty('--dx', dx);\n    p.style.animationDuration = dur + 's';\n    p.style.animationDelay = delay + 's';\n    p.style.opacity = .9;\n    layer.appendChild(p);\n  }\n\n  // CTA section particles (lighter density, contained to that section)\n  const ctaLayer = document.getElementById('ctaParticles');\n  if (ctaLayer){\n    for (let i = 0; i < 30; i++){\n      const p = document.createElement('span');\n      const tint = ['', '', 'cool', 'warm'][Math.floor(Math.random() * 4)];\n      p.className = 'p' + (tint ? ' ' + tint : '');\n      const left = Math.random() * 100;\n      const size = 2 + Math.random() * 3.5;\n      const dur = 11 + Math.random() * 16;\n      const delay = -Math.random() * dur;\n      const dx = (Math.random() * 50 - 25) + 'px';\n      p.style.left = left + '%';\n      p.style.width = size + 'px';\n      p.style.height = size + 'px';\n      p.style.setProperty('--dx', dx);\n      p.style.animationDuration = dur + 's';\n      p.style.animationDelay = delay + 's';\n      p.style.opacity = .85;\n      ctaLayer.appendChild(p);\n    }\n  }\n\n  // Subtle 3D tilt on feature/step cards on hover\n  document.querySelectorAll('.feature, .step').forEach(el => {\n    el.style.transformStyle = 'preserve-3d';\n    el.addEventListener('pointermove', (e) => {\n      const r = el.getBoundingClientRect();\n      const nx = (e.clientX - r.left) / r.width - .5;\n      const ny = (e.clientY - r.top)  / r.height - .5;\n      el.style.transform = `translateY(-4px) perspective(900px) rotateY(${(nx*6).toFixed(2)}deg) rotateX(${(-ny*5).toFixed(2)}deg)`;\n    });\n    el.addEventListener('pointerleave', () => { el.style.transform = ''; });\n  });\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
